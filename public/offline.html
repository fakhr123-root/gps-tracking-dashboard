<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070d17">
  <title>GeoRadar 3D Studio - يرجى الاتصال بالإنترنت</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none !important;
      overscroll-behavior-y: none !important;
      background-color: #070d17;
      background-image:
        radial-gradient(circle at 50% 35%, rgba(16, 185, 129, 0.16) 0%, rgba(6, 182, 212, 0.06) 40%, transparent 70%);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .offline-card {
      max-width: 420px;
      width: 100%;
      background: linear-gradient(160deg, rgba(13, 31, 41, 0.95) 0%, rgba(7, 14, 24, 0.98) 100%);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 28px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.85), 0 0 45px rgba(16, 185, 129, 0.18);
      position: relative;
      overflow: hidden;
    }
    .radar-icon-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pulse-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(245, 158, 11, 0.45);
      animation: pulseAnim 2.2s infinite ease-out;
    }
    .pulse-ring-2 {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1.5px dashed rgba(16, 185, 129, 0.45);
      animation: spinAnim 8s infinite linear;
    }
    .core-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.55);
      position: relative;
      z-index: 2;
    }
    @keyframes pulseAnim {
      0% { transform: scale(0.88); opacity: 0.9; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    @keyframes spinAnim {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fcd34d;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 10px;
    }
    p {
      font-size: 13.5px;
      line-height: 1.7;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .retry-btn {
      width: 100%;
      padding: 15px 20px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(90deg, #10b981, #14b8a6, #06b6d4);
      color: #022c22;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .retry-btn:active {
      transform: scale(0.98);
    }
    .status-note {
      margin-top: 16px;
      font-size: 11.5px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="radar-icon-wrap">
      <div class="pulse-ring"></div>
      <div class="pulse-ring-2"></div>
      <div class="core-circle">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#022c22" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
    </div>

    <div class="badge">
      <span class="dot"></span>
      <span>انقطاع الاتصال بالشبكة</span>
    </div>

    <h1>يرجى الاتصال بالإنترنت</h1>
    <p>
      تطبيق <strong>GeoRadar 3D Studio</strong> يتطلب اتصالاً مباشراً بالإنترنت لاستخراج البيانات الحية وتشغيل الرادار الجغرافي.
    </p>

    <button type="button" class="retry-btn" id="retryBtn" onclick="tryReconnect()">
      إعادة المحاولة الآن
    </button>

    <div class="status-note" id="statusNote">
      سيتم فتح التطبيق تلقائياً فور عودة الاتصال بالإنترنت
    </div>
  </div>

  <script>
    // Block pull-to-refresh gestures
    let startY = 0;
    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) startY = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });

    function tryReconnect() {
      const btn = document.getElementById('retryBtn');
      const note = document.getElementById('statusNote');
      btn.innerText = 'جاري التحقق من الاتصال...';
      fetch('/api/health', { cache: 'no-store' })
        .then((res) => {
          if (res.ok) window.location.replace('/');
          else throw new Error('offline');
        })
        .catch(() => {
          btn.innerText = 'إعادة المحاولة الآن';
          note.innerText = 'لا يزال الإنترنت غير متصل — يرجى تشغيل Wi-Fi أو بيانات الهاتف';
          note.style.color = '#fbbf24';
        });
    }

    window.addEventListener('online', () => {
      window.location.replace('/');
    });
  </script>
</body>
</html>
